name: Gerar changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da release (ex.: v1.1.0). Vazio = bump automático de patch."
        required: false
        default: ""

jobs:
  changelog:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Gerar public/changelog.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            node scripts/changelog.mjs --version "${{ inputs.version }}"
          else
            node scripts/changelog.mjs
          fi

      - name: Commitar no develop
        run: |
          git config user.name "changelog-bot"
          git config user.email "actions@users.noreply.github.com"

          git add public/changelog.json

          if git diff --cached --quiet; then
            echo "Nada para commitar."
            exit 0
          fi

          git commit -m "chore(changelog): atualizar public/changelog.json"
          git push origin develop
