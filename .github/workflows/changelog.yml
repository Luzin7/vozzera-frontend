name: Gerar changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da release (ex.: v1.1.0). Vazio = automático: feat sobe minor, breaking sobe major, o resto sobe patch."
        required: false
        default: ""

concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Atualizar destaques pendentes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/changelog.mjs

      - name: Lançar versão (falha se faltar summary)
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            node scripts/changelog.mjs --release --version "$RELEASE_VERSION"
          else
            node scripts/changelog.mjs --release
          fi

      - name: Commitar no develop
        run: |
          git config user.name "changelog-bot"
          git config user.email "actions@users.noreply.github.com"

          git add public/changelog.json

          if git diff --cached --quiet; then
            echo "Nada para commitar."
            exit 0
          fi

          git commit -m "chore(changelog): atualizar public/changelog.json"
          git pull --rebase origin develop
          git push origin develop
